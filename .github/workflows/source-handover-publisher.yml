name: Private source handover publisher (opt-in)

# Only this session's branch is a source. A manual run must also target it.
on:
  push:
    branches:
      - arena/f649c1bd-chatbox
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Keep a single publisher at a time. A newer pending run replaces an older one.
concurrency:
  group: private-source-handover-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # Disabled unless an administrator has deliberately configured the variable.
    # Do not enable without reviewing the script, destination, history and access.
    if: ${{ vars.CHATBOX_SOURCE_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/arena/f649c1bd-chatbox' && !contains(github.event.head_commit.message, '[isolated-apk]') && !contains(github.event.head_commit.message, '[retrieve-test-apk]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: arena/f649c1bd-chatbox
          fetch-depth: 0
      - name: Validate publisher configuration
        env:
          PROVIDER: ${{ vars.CHATBOX_SOURCE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.CHATBOX_SOURCE_SERVICE_ACCOUNT }}
          FILE_ID: ${{ vars.CHATBOX_SOURCE_DRIVE_FILE_ID }}
        run: |
          test -n "$PROVIDER" && test -n "$SERVICE_ACCOUNT" && test -n "$FILE_ID"
          test "$(git rev-parse --is-shallow-repository)" = false
      - name: Create committed snapshot and reachable Git history
        run: python3 scripts/export-source-handover.py "$RUNNER_TEMP/Chatbox-source.zip"
      - id: google-auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: ${{ vars.CHATBOX_SOURCE_WIF_PROVIDER }}
          service_account: ${{ vars.CHATBOX_SOURCE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive
      - name: Refuse an already stale snapshot
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/arena/f649c1bd-chatbox | cut -f1)"
      - name: Replace contents of existing private Drive archive
        env:
          CHATBOX_DRIVE_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          CHATBOX_DRIVE_FILE_ID: ${{ vars.CHATBOX_SOURCE_DRIVE_FILE_ID }}
        run: python3 scripts/publish-source-handover.py "$RUNNER_TEMP/Chatbox-source.zip"
