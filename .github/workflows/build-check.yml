name: Build Check (PR)

# Catches compile/test breakage BEFORE merge, so a broken change can never
# reach main (and therefore never break the release pipeline).
# Uses a stub google-services.json when the real secret is unavailable
# (e.g. fork PRs) — enough to compile and run unit tests, never shipped.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Resolve google-services.json (secret or stub for compile/test)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Using app/google-services.json from repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            GS_TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\n\r ')
            case "$GS_TRIMMED" in
              \{*) printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *) printf '%s' "$GS_TRIMMED" | base64 -d > app/google-services.json ;;
            esac
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::warning::No google-services.json secret available — writing a STUB for compile/test only (never shipped)."
            printf '%s\n' '{"project_info":{"project_number":"000000000000","project_id":"chatbox-stub","storage_bucket":"chatbox-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aistudio.chatbox.kxmpzq"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSTUB000000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Cache Robolectric Android SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk35-15-12650502-i7

      - name: Pre-fetch Robolectric SDK 35 jar cleanly
        run: |
          DEST="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          mkdir -p "$DEST"
          BASE_PATH="org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          FILES=(
            "android-all-instrumented-15-robolectric-12650502-i7.jar"
            "android-all-instrumented-15-robolectric-12650502-i7.jar.sha512"
            "android-all-instrumented-15-robolectric-12650502-i7.pom"
            "android-all-instrumented-15-robolectric-12650502-i7.pom.sha512"
          )
          MIRRORS=(
            "https://repo.maven.apache.org/maven2"
            "https://maven-central.storage-download.googleapis.com/maven2"
            "https://repo1.maven.org/maven2"
          )
          for FILE in "${FILES[@]}"; do
            TARGET="$DEST/$FILE"
            if [ -s "$TARGET" ]; then
              continue
            fi
            DOWNLOADED=false
            for MIRROR in "${MIRRORS[@]}"; do
              if curl -fSL --retry 4 --retry-delay 3 --retry-all-errors -A "Mozilla/5.0" "$MIRROR/$BASE_PATH/$FILE" -o "$TARGET.tmp"; then
                mv "$TARGET.tmp" "$TARGET"
                DOWNLOADED=true
                break
              fi
            done
            rm -f "$TARGET.tmp"
            if [ "$DOWNLOADED" != "true" ]; then
              echo "::error::Failed to download Robolectric artifact: $FILE"
              exit 1
            fi
          done

      - name: Setup Gradle (cache; uses wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Compile + run unit tests (debug)
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon \
            -Drobolectric.offline=true \
            -Drobolectric.dependency.dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7" \
            2>&1 | tee gradle-output.txt
          status=${PIPESTATUS[0]}
          grep -E " STARTED$" gradle-output.txt | tail -n 3 | while IFS= read -r line; do
            echo "::notice::LAST-STARTED ${line}"
          done
          if [ -f app/hang-dump.txt ]; then
            grep -vE "java\.base|jdk\.internal|org\.junit|org\.gradle|sun\." app/hang-dump.txt | head -n 45 | while IFS= read -r line; do
              echo "::notice::HANG ${line}"
            done
          fi
          if [ "$status" -ne 0 ]; then
            echo "::group::Failure highlights"
            grep -nE "^e: |FAILURE:|What went wrong|> Task .* FAILED|FAILED$" gradle-output.txt | tail -n 40 || true
            echo "::endgroup::"
            # Surface errors as annotations so they are readable from `gh run view`
            # even when raw log download from blob storage is unavailable.
            {
              grep -E "^e: " gradle-output.txt | head -n 15
              awk '/What went wrong:/{f=1} f{print; n++; if(n>=20) exit}' gradle-output.txt
              grep -E "^> Task .* FAILED$" gradle-output.txt | head -n 10
            } | sed '/^[[:space:]]*$/d' | head -n 30 | while IFS= read -r line; do
                enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
                echo "::error::${enc}"
              done
            # Extract failing test names + messages from JUnit XML reports.
            python3 .github/scripts/extract-test-failures.py > failing-tests.txt 2>&1 || true
            while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error::TESTFAIL ${enc}"
            done < failing-tests.txt
            echo "::error::Gradle exited with status $status."
          fi
          exit "$status"
