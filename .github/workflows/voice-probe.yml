# Temporary diagnostic for Saira voice mode speech-to-text (removed after use).
name: Voice probe
on:
  push:
    branches: [arena/e6004471-chatbox]
    paths: ['.github/workflows/voice-probe.yml', '.github/scripts/voice_probe.py']
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        env:
          POOL_RAW: ${{ secrets.AI_KEY_POOL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, re
          raw = os.environ.get("POOL_RAW") or ""
          if not raw.lstrip().startswith("AQ.") and not raw.lstrip().startswith("AIza"):
              raw = base64.b64decode(re.sub(r"\s+", "", raw)).decode()
          open("/tmp/pool.txt", "w", encoding="utf-8").write(raw)
          PY
          pip install --quiet gTTS
          sudo apt-get install -y -qq espeak-ng ffmpeg >/dev/null 2>&1 || true
          timeout 600s python3 .github/scripts/voice_probe.py
      - name: Cleanup
        if: always()
        run: rm -f /tmp/pool.txt
