# Downloads a published release APK and checks the bundled Saira key pool
# (count / format only — keys are never printed).
name: Verify release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.0.0.74
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p apks
          gh release download "$TAG" -R "${{ github.repository }}" -p "*.apk" -D apks
          BT=$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)
          for f in apks/*.apk; do
            name=$(basename "$f")
            listener=$("${ANDROID_HOME}/build-tools/${BT}/aapt2" dump xmltree "$f" --file AndroidManifest.xml | grep -c "BIND_NOTIFICATION_LISTENER_SERVICE" || true)
            if ! unzip -l "$f" | grep -q "assets/saira_pool.dat"; then
              echo "::notice title=SUMMARY::$name bundled_asset=MISSING listener=$listener"; continue
            fi
            unzip -p "$f" assets/saira_pool.dat > pool.dat
            NAME="$name" LISTENER="$listener" python3 - <<'PY'
          import base64, os
          d = base64.b64decode(open("pool.dat").read().strip())
          m = b"chatbox-saira-pool"
          keys = bytes(b ^ m[i % len(m)] for i, b in enumerate(d)).decode().splitlines()
          lens = sorted({len(k) for k in keys})
          pre = sorted({k[:3] for k in keys})
          print(f"::notice title=SUMMARY::{os.environ['NAME']} bundled_asset=present keys={len(keys)} lens={lens} prefixes={pre} listener={os.environ['LISTENER']}")
          PY
            rm -f pool.dat
          done
          rm -rf apks
