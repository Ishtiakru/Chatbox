name: Recover emulator test log (temporary)
on:
  push:
    branches: [arena/f649c1bd-chatbox]
permissions:
  actions: read
  contents: write
  statuses: write
jobs:
  transfer:
    if: contains(github.event.head_commit.message, '[recover-emulator-log]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Transfer synthetic emulator job log without printing it
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/137085345486/logs" > /tmp/emulator-job.log
          python3 - <<'PY'
          import base64, json
          with open('/tmp/emulator-job.log','rb') as f: content=base64.b64encode(f.read()).decode('ascii')
          with open('/tmp/emulator-job.json','w') as f: json.dump({'content':content,'encoding':'base64'},f)
          PY
          blob=$(gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/emulator-job.json --jq .sha)
          [[ "$blob" =~ ^[0-9a-f]{40}$ ]]
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=emulator-log-transfer -f description="$blob" > /dev/null
