# Lightfall Android APK — TwaGenerator ডিরেক্ট + gradle + apksigner (শূন্য-প্রম্পট)
name: Build Lightfall APK

on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/build-apk.yml" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bubblewrap কোর ইনস্টল
        run: npm install -g @bubblewrap/cli

      - name: সাইনিং-কী + twa-manifest
        run: |
          mkdir -p apkbuild && cd apkbuild
          keytool -genkeypair -v -keystore android.keystore -alias android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lightfall123 -keypass lightfall123 \
            -dname "CN=Lightfall, O=Ishtiakru, C=BD"
          cat > twa-manifest.json <<'JSON'
          {
            "packageId": "com.ishtiakru.lightfall",
            "host": "ishtiakru.github.io",
            "name": "Lightfall",
            "launcherName": "Lightfall",
            "display": "fullscreen",
            "themeColor": "#030711",
            "themeColorDark": "#030711",
            "navigationColor": "#030711",
            "navigationColorDark": "#030711",
            "navigationDividerColor": "#030711",
            "navigationDividerColorDark": "#030711",
            "backgroundColor": "#030711",
            "enableNotifications": false,
            "startUrl": "/Chatbox/",
            "iconUrl": "https://ishtiakru.github.io/Chatbox/icon-512.png",
            "maskableIconUrl": "https://ishtiakru.github.io/Chatbox/icon-maskable.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "capacity": 45,
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "webManifestUrl": "https://ishtiakru.github.io/Chatbox/manifest.webmanifest",
            "fallbackType": "webview",
            "features": {},
            "minSdkVersion": 21
          }
          JSON

      - name: TWA প্রজেক্ট জেনারেট (TwaGenerator ডিরেক্ট — প্রম্পট-ফ্রি)
        run: |
          cd apkbuild
          NODE_PATH=$(npm root -g) node -e "
            const core = require('@bubblewrap/core');
            const log = { info(){}, warn(){}, error(){}, debug(){} };
            (async () => {
              const twaManifest = await core.TwaManifest.fromFile('twa-manifest.json');
              const gen = new core.TwaGenerator();
              await gen.createTwaProject('.', twaManifest, log);
              console.log('PROJECT_GENERATED ✓');
            })().catch(e => { console.error('GEN_FAIL: ' + (e.stack || e.message)); process.exit(1); });
          "

      - name: APK বিল্ড (gradle assembleRelease)
        run: |
          cd apkbuild
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee build.log | tail -3

      - name: ত্রুটি-ডায়াগ
        if: failure()
        run: |
          cd apkbuild
          grep -E "error:|ERROR|FAILURE|Caused by|What went wrong" build.log | tail -n 15 | cut -c1-160 | while IFS= read -r line; do
            echo "::error::${line//%/Ø}"
          done

      - name: সাইন করা (zipalign + apksigner)
        run: |
          cd apkbuild
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks android.keystore --ks-key-alias android \
            --ks-pass pass:lightfall123 --key-pass pass:lightfall123 \
            --out app-release-signed.apk aligned.apk
          "$BT/apksigner" verify app-release-signed.apk && echo "সাইন-যাচাই ✓"

      - name: GitHub Release-এ তোলা
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apkbuild
          cp app-release-signed.apk Lightfall-v1.0.apk
          gh release create lightfall-android-v1.0 Lightfall-v1.0.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lightfall — Android APK v1.0" \
            --notes "ডাউনলোড: Lightfall-v1.0.apk → ফোনে খুলুন → 'অজানা উৎস থেকে ইনস্টল' অনুমতি দিন → ইনস্টল → হোম-স্ক্রিনে Lightfall! ওয়েব সাইট: https://ishtiakru.github.io/Chatbox/" \
            --clobber || gh release upload lightfall-android-v1.0 Lightfall-v1.0.apk --repo "$GITHUB_REPOSITORY" --clobber
