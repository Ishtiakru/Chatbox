name: Generate Permanent Keystore Once (Phone-Friendly)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key alias (keep default: chatbox)'
        required: true
        default: 'chatbox'
      keystore_password:
        description: 'Choose a strong keystore password (save it for GitHub Secrets)'
        required: true

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate permanent Android release keystore
        env:
          KEY_ALIAS: ${{ github.event.inputs.key_alias }}
          KEY_PASS: ${{ github.event.inputs.keystore_password }}
        run: |
          mkdir -p out-keystore
          keytool -genkeypair -v \
            -keystore out-keystore/chatbox-release.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Chatbox, OU=Mobile, O=Chatbox, L=Dhaka, ST=Dhaka, C=BD"

          echo "### Permanent SHA Fingerprints (Add ONCE to Firebase Console -> com.aistudio.chatbox.kxmpzq)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore out-keystore/chatbox-release.jks \
            -alias "$KEY_ALIAS" -storepass "$KEY_PASS" | grep -E "SHA1:|SHA256:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          base64 -w 0 out-keystore/chatbox-release.jks > out-keystore/ANDROID_KEYSTORE_BASE64.txt

      - name: Upload private keystore artifact (1-day retention, owner download only)
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-permanent-keystore
          path: out-keystore/
          retention-days: 1
