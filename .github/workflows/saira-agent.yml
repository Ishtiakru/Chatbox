name: Saira agent (app change)

# The admin tells Saira (inside the app) what to change. The app dispatches
# this workflow with the admin's own GitHub token. Saira writes the code,
# compiles it and fixes her own errors; only a change that passes unit tests
# AND a release build is pushed to main and released — then the app updates
# itself in-app. A failing change is never published.
run-name: "Saira agent ${{ inputs.request_id }}"

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: What to change (natural language)
        required: true
      request_id:
        description: request id from the app
        required: false
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: saira-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Resolve google-services.json (secret or stub for compile/test)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Using app/google-services.json from repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            GS_TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\n\r ')
            case "$GS_TRIMMED" in
              \{*) printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *) printf '%s' "$GS_TRIMMED" | base64 -d > app/google-services.json ;;
            esac
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::warning::No google-services.json secret available — writing a STUB for compile/test only (never shipped)."
            printf '%s\n' '{"project_info":{"project_number":"000000000000","project_id":"chatbox-stub","storage_bucket":"chatbox-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aistudio.chatbox.kxmpzq"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSTUB000000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Cache Robolectric Android SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk35-15-12650502-i7

      - name: Pre-fetch Robolectric SDK 35 jar cleanly
        run: |
          DEST="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          mkdir -p "$DEST"
          BASE_PATH="org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          FILES=(
            "android-all-instrumented-15-robolectric-12650502-i7.jar"
            "android-all-instrumented-15-robolectric-12650502-i7.jar.sha512"
            "android-all-instrumented-15-robolectric-12650502-i7.pom"
            "android-all-instrumented-15-robolectric-12650502-i7.pom.sha512"
          )
          MIRRORS=(
            "https://repo.maven.apache.org/maven2"
            "https://maven-central.storage-download.googleapis.com/maven2"
            "https://repo1.maven.org/maven2"
          )
          for FILE in "${FILES[@]}"; do
            TARGET="$DEST/$FILE"
            if [ -s "$TARGET" ]; then
              continue
            fi
            DOWNLOADED=false
            for MIRROR in "${MIRRORS[@]}"; do
              if curl -fSL --retry 4 --retry-delay 3 --retry-all-errors -A "Mozilla/5.0" "$MIRROR/$BASE_PATH/$FILE" -o "$TARGET.tmp"; then
                mv "$TARGET.tmp" "$TARGET"
                DOWNLOADED=true
                break
              fi
            done
            rm -f "$TARGET.tmp"
            if [ "$DOWNLOADED" != "true" ]; then
              echo "::error::Failed to download Robolectric artifact: $FILE"
              exit 1
            fi
          done

      - name: Setup Gradle (cache; uses wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Saira writes the change
        id: agent
        env:
          AI_KEY_POOL: ${{ secrets.AI_KEY_POOL }}
          INSTRUCTION: ${{ inputs.instruction }}
        run: python3 .github/scripts/saira_agent.py

      - name: Verify (unit tests + release build)
        if: steps.agent.outputs.changed == 'true'
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --no-daemon \
            -Drobolectric.offline=true \
            -Drobolectric.dependency.dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7" \
            2>&1 | tee verify.txt
          s=${PIPESTATUS[0]}
          if [ "$s" -eq 0 ]; then
            ./gradlew :app:assembleRelease --no-daemon 2>&1 | tee -a verify.txt
            s=${PIPESTATUS[0]}
          fi
          if [ "$s" -ne 0 ]; then
            first=$( { grep -E "^e: " verify.txt; grep -B3 -E "FAILED$" verify.txt; grep -B20 "Lint found fatal" verify.txt; } | head -n 6 | tr '\n' ' ' | cut -c1-500)
            echo "::notice title=SAIRA::যাচাই (টেস্ট/রিলিজ বিল্ড) পাস করেনি, তাই অ্যাপে কিছু প্রকাশ করিনি। ${first}"
            exit 1
          fi

      - name: Publish to main + start release
        if: steps.agent.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ inputs.request_id }}
        run: |
          set -e
          git config user.name "Saira (Chatbox agent)"
          git config user.email "saira-agent@users.noreply.github.com"
          git add -A app/src/main
          git reset -q app/google-services.json 2>/dev/null || true
          git reset -q app/src/main/assets/saira_pool.dat 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "::notice title=SAIRA::কোনো পরিবর্তন পাওয়া যায়নি।"
            exit 1
          fi
          SUMMARY=$(cat /tmp/agent_summary.txt 2>/dev/null | head -c 200)
          git commit -q -m "Saira agent: ${SUMMARY}" -m "Request ${RID}"
          for i in 1 2 3; do
            if git push -q origin HEAD:main; then break; fi
            git pull -q --rebase origin main
          done
          gh workflow run release-apk.yml --ref main -f version_name=
          echo "::notice title=SAIRA::PUBLISHED $(git rev-parse --short HEAD) — নতুন ভার্সন রিলিজ হচ্ছে।"
