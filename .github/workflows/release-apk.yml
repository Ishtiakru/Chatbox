name: Build Signed Chatbox APK & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Restore fixed release keystore (keeps SHA-1 & SHA-256 identical forever)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 secret. Run scripts/setup-fixed-keystore.sh or the Generate Permanent Keystore workflow once and add the secret so SHA never changes."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/chatbox-release.jks"
          keytool -list -v -keystore "${{ runner.temp }}/chatbox-release.jks" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -E "SHA1:|SHA256:"

      - name: Build & sign Native Android Release APK
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name || '1.0.1' }}
          KEYSTORE_PATH: ${{ runner.temp }}/chatbox-release.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          CLEAN_VER="${VERSION_NAME#v}"
          gradle :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "ERROR: Built release APK not found."
            exit 1
          fi
          cp "$APK_SOURCE" "chatbox-v${CLEAN_VER}.apk"
          "${ANDROID_HOME}/build-tools/"$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner verify --print-certs "chatbox-v${CLEAN_VER}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-release-apk
          path: chatbox-v*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', github.event.inputs.version_name || '1.0.1') }}
          name: Chatbox Release
          files: chatbox-v*.apk
          generate_release_notes: true
