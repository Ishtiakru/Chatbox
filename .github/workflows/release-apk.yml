name: Build Signed Chatbox APK & Publish GitHub Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/incoming/**'
      - '.github/scripts/**'
      - '.github/workflows/add-keys.yml'
      - '.github/workflows/test-ai-keys.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Resolve google-services.json (repo or GitHub Secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -f "app/google-services.json" ]; then
            echo "Using app/google-services.json from repository."
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            GS_TRIMMED=$(printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\n\r ')
            case "$GS_TRIMMED" in
              \{*) printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json ;;
              *) printf '%s' "$GS_TRIMMED" | base64 -d > app/google-services.json ;;
            esac
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\n\r ' | base64 -d > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          else
            echo "::error::app/google-services.json is missing. Add a GitHub Actions secret named GOOGLE_SERVICES_JSON (contents of app/google-services.json) or GOOGLE_SERVICES_JSON_BASE64 in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Cache Robolectric Android SDK jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdk35-15-12650502-i7

      - name: Pre-fetch Robolectric SDK 35 jar cleanly
        run: |
          DEST="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          mkdir -p "$DEST"
          BASE_PATH="org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"
          FILES=(
            "android-all-instrumented-15-robolectric-12650502-i7.jar"
            "android-all-instrumented-15-robolectric-12650502-i7.jar.sha512"
            "android-all-instrumented-15-robolectric-12650502-i7.pom"
            "android-all-instrumented-15-robolectric-12650502-i7.pom.sha512"
          )
          MIRRORS=(
            "https://repo.maven.apache.org/maven2"
            "https://maven-central.storage-download.googleapis.com/maven2"
            "https://repo1.maven.org/maven2"
          )
          for FILE in "${FILES[@]}"; do
            TARGET="$DEST/$FILE"
            if [ -s "$TARGET" ]; then
              continue
            fi
            DOWNLOADED=false
            for MIRROR in "${MIRRORS[@]}"; do
              if curl -fSL --retry 4 --retry-delay 3 --retry-all-errors -A "Mozilla/5.0" "$MIRROR/$BASE_PATH/$FILE" -o "$TARGET.tmp"; then
                mv "$TARGET.tmp" "$TARGET"
                DOWNLOADED=true
                break
              fi
            done
            rm -f "$TARGET.tmp"
            if [ "$DOWNLOADED" != "true" ]; then
              echo "::error::Failed to download Robolectric artifact: $FILE"
              exit 1
            fi
          done

      - name: Run unit tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon \
            -Drobolectric.offline=true \
            -Drobolectric.dependency.dir="$HOME/.m2/repository/org/robolectric/android-all-instrumented/15-robolectric-12650502-i7"

      - name: Determine release version & tag
        id: meta
        run: |
          BASE_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | head -n 1)
          BASE_VER="${BASE_VER:-1.0.0}"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          elif [ -n "${{ github.event.inputs.version_name }}" ]; then
            VER="${{ github.event.inputs.version_name }}"
            VER="${VER#v}"
            TAG="v${VER}"
          else
            VER="${BASE_VER}.${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Resolve fixed keystore (GitHub Secret or repo release.keystore)
        id: ks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/chatbox-release.jks"
            STORE_PATH="${{ runner.temp }}/chatbox-release.jks"
            STORE_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          elif [ -f "release.keystore" ] && [ -f "keystore.properties" ]; then
            STORE_PATH="$(pwd)/release.keystore"
            STORE_PASS=$(grep '^storePassword=' keystore.properties | cut -d'=' -f2-)
            KEY_ALIAS=$(grep '^keyAlias=' keystore.properties | cut -d'=' -f2-)
            KEY_PASS=$(grep '^keyPassword=' keystore.properties | cut -d'=' -f2-)
          else
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 secret and release.keystore."
            exit 1
          fi
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "store_path=$STORE_PATH" >> "$GITHUB_OUTPUT"
          echo "store_pass=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
          echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"
          keytool -list -v -keystore "$STORE_PATH" -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep -E "SHA1:|SHA256:"

      - name: Bundle Saira key pool into APK assets (never committed)
        env:
          POOL_RAW: ${{ secrets.AI_KEY_POOL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os, re
          raw = os.environ.get("POOL_RAW") or ""
          if not raw.strip():
              print("::warning::AI_KEY_POOL secret empty - APK ships without bundled keys")
              raise SystemExit(0)
          text = raw
          if not re.search(r"AQ\.|AIza", raw):
              text = base64.b64decode(re.sub(r"\s+", "", raw)).decode()
          keys = []
          for line in text.splitlines():
              k = line.strip()
              if k and not k.startswith("#") and k not in keys:
                  keys.append(k)
          mask = b"chatbox-saira-pool"
          plain = "\n".join(keys).encode()
          enc = bytes(b ^ mask[i % len(mask)] for i, b in enumerate(plain))
          os.makedirs("app/src/main/assets", exist_ok=True)
          open("app/src/main/assets/saira_pool.dat", "w").write(base64.b64encode(enc).decode())
          print(f"bundled keys={len(keys)}")
          PY

      - name: Build & sign Native Android Release APK
        env:
          CLEAN_VER: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.meta.outputs.code }}
          KEYSTORE_PATH: ${{ steps.ks.outputs.store_path }}
          KEYSTORE_PASS: ${{ steps.ks.outputs.store_pass }}
          KEY_ALIAS: ${{ steps.ks.outputs.key_alias }}
          KEY_PASS: ${{ steps.ks.outputs.key_pass }}
        run: |
          set +e
          gradle :app:assembleRelease --no-daemon \
            -Pchatbox.versionCode="$VERSION_CODE" -Pchatbox.versionName="$CLEAN_VER" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tee rel-standard.txt
          S1=${PIPESTATUS[0]}
          if [ "$S1" -ne 0 ]; then
            {
              grep -E "^e: " rel-standard.txt | head -n 15
              awk '/What went wrong:/{f=1} f{print; n++; if(n>=20) exit}' rel-standard.txt
            } | sed '/^[[:space:]]*$/d' | head -n 30 | while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error::REL-STD ${enc}"
            done
            echo "::error::standard assembleRelease exited with status $S1."
            exit "$S1"
          fi
          set -e

          APK_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            echo "ERROR: Built release APK not found."
            exit 1
          fi
          cp "$APK_SOURCE" "chatbox-v${CLEAN_VER}.apk"

          # Full edition: same app + WhatsApp/Messenger auto-reply listener.
          rm -rf app/build/outputs/apk/release
          set +e
          gradle :app:assembleRelease --no-daemon -Pchatbox.autoReply=true \
            -Pchatbox.versionCode="$VERSION_CODE" -Pchatbox.versionName="$CLEAN_VER" \
            -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS" 2>&1 | tee rel-full.txt
          S2=${PIPESTATUS[0]}
          if [ "$S2" -ne 0 ]; then
            {
              grep -E "^e: " rel-full.txt | head -n 15
              awk '/What went wrong:/{f=1} f{print; n++; if(n>=20) exit}' rel-full.txt
            } | sed '/^[[:space:]]*$/d' | head -n 30 | while IFS= read -r line; do
              enc=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g')
              echo "::error::REL-FULL ${enc}"
            done
            echo "::error::full assembleRelease exited with status $S2."
            exit "$S2"
          fi
          set -e
          FULL_SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$FULL_SOURCE" ]; then
            echo "ERROR: Built full APK not found."
            exit 1
          fi
          cp "$FULL_SOURCE" "chatbox-v${CLEAN_VER}-full.apk"
          # Stable name so releases/latest/download/chatbox-full.apk always works.
          cp "$FULL_SOURCE" "chatbox-full.apk"
          BT=$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)
          FULL_HAS=$("${ANDROID_HOME}/build-tools/${BT}/aapt2" dump xmltree "chatbox-v${CLEAN_VER}-full.apk" --file AndroidManifest.xml | grep -c "BIND_NOTIFICATION_LISTENER_SERVICE" || true)
          STD_HAS=$("${ANDROID_HOME}/build-tools/${BT}/aapt2" dump xmltree "chatbox-v${CLEAN_VER}.apk" --file AndroidManifest.xml | grep -c "BIND_NOTIFICATION_LISTENER_SERVICE" || true)
          echo "::notice::listener in full=$FULL_HAS standard=$STD_HAS"
          if [ "$FULL_HAS" = "0" ] || [ "$STD_HAS" != "0" ]; then
            echo "::error::APK edition manifest check failed (full=$FULL_HAS standard=$STD_HAS)"
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)
          APKSIGNER_OUT=$("${ANDROID_HOME}/build-tools/${BUILD_TOOLS_DIR}/apksigner" verify --print-certs "chatbox-v${CLEAN_VER}.apk")
          echo "$APKSIGNER_OUT"
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "$APKSIGNER_OUT" | grep -qi "e2f4a86c4d29f3037f4916492053c82c9332582a" || {
              echo "::error::APK SHA-1 mismatch! Expected fixed release.keystore fingerprint."
              exit 1
            }
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-release-apk
          path: |
            chatbox-v*.apk
            chatbox-full.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Chatbox ${{ steps.meta.outputs.tag }}
          files: chatbox-v*.apk
          generate_release_notes: true

      - name: Upload stable-name full APK (chatbox-full.apk)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release upload "$TAG" chatbox-full.apk --clobber -R "${{ github.repository }}"; then
              echo "uploaded chatbox-full.apk"; exit 0
            fi
            sleep $((i * 10))
          done
          echo "::warning::could not upload chatbox-full.apk"
