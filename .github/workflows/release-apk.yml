name: Build Signed Chatbox APK & Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Live Chatbox HTTPS URL for the Android app'
        required: true
        default: 'https://ais-pre-4jxsyz44wyo3rzr3s2afz6-247983508059.asia-northeast1.run.app'
      version_name:
        description: 'Release version name (e.g. 1.0.1)'
        required: true
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies, lint & verify web build
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Restore fixed release keystore (keeps SHA-1 & SHA-256 identical forever)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Missing ANDROID_KEYSTORE_BASE64 secret. Run scripts/setup-fixed-keystore.sh once and add the secret to GitHub so SHA never changes."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/chatbox-release.jks"
          keytool -list -v -keystore "${{ runner.temp }}/chatbox-release.jks" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" | grep -E "SHA1:|SHA256:"

      - name: Build & sign Android APK with fixed keystore (TWA)
        env:
          APP_URL: ${{ github.event.inputs.app_url || 'https://ais-pre-4jxsyz44wyo3rzr3s2afz6-247983508059.asia-northeast1.run.app' }}
          VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name || '1.0.1' }}
          KEYSTORE_PATH: ${{ runner.temp }}/chatbox-release.jks
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          CLEAN_VER="${VERSION_NAME#v}"
          npx --yes @bubblewrap/cli init \
            --manifest="$APP_URL/manifest.webmanifest" \
            --directory=android-twa || true

          mkdir -p android-twa
          cat > android-twa/twa-manifest.json <<EOF
          {
            "packageId": "com.chatbox.saira",
            "host": "$(echo "$APP_URL" | sed -E 's#https?://([^/]+).*#\1#')",
            "name": "Chatbox",
            "launcherName": "Chatbox",
            "display": "standalone",
            "themeColor": "#8b5cf6",
            "navigationColor": "#f7f5fb",
            "backgroundColor": "#ffffff",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "$APP_URL/assets/chatbox_logo_lavender.jpg",
            "signingKey": {
              "path": "$KEYSTORE_PATH",
              "alias": "$KEY_ALIAS"
            },
            "appVersionName": "$CLEAN_VER",
            "appVersionCode": ${{ github.run_number }},
            "fallbackType": "customtabs"
          }
          EOF

          cd android-twa
          npx --yes @bubblewrap/cli update --skipPwaValidation || npx --yes @bubblewrap/cli init --manifest="$APP_URL" --skipPwaValidation
          BUBBLEWRAP_KEYSTORE_PASSWORD="$KEYSTORE_PASS" BUBBLEWRAP_KEY_PASSWORD="$KEY_PASS" \
            npx --yes @bubblewrap/cli build --skipPwaValidation

          APK_SOURCE=$(find . -name "app-release-signed.apk" | head -n 1)
          if [ -z "$APK_SOURCE" ]; then
            APK_SOURCE=$(find . -name "*.apk" | head -n 1)
          fi
          cp "$APK_SOURCE" "../chatbox-v${CLEAN_VER}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-release-apk
          path: chatbox-v*.apk

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && startsWith(github.ref_name, 'v') && github.ref_name || format('v{0}', github.event.inputs.version_name || '1.0.1') }}
          name: Chatbox Release
          files: chatbox-v*.apk
          generate_release_notes: true
