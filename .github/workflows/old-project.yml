# Audit / move / delete the OLD duplicate Firebase project (gen-lang-client-0532609883).
name: Old project (audit / copy / delete)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit (read-only) | copy (missing data only, never overwrites) | delete
        required: true
        default: audit
        type: choice
        options: [audit, copy, delete]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth requests
      - name: Decode keys
        env:
          OLD_RAW: ${{ secrets.FIREBASE_ADMIN_KEY_OLD }}
          NEW_RAW: ${{ secrets.FIREBASE_ADMIN_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re
          for env, path in (("OLD_RAW", "/tmp/old.json"), ("NEW_RAW", "/tmp/new.json")):
              raw = os.environ[env]
              txt = raw if raw.lstrip().startswith("{") else base64.b64decode(re.sub(r"\s+", "", raw)).decode()
              json.loads(txt)
              open(path, "w").write(txt)
          PY
      - name: Run
        run: timeout 900s python3 .github/scripts/old_project.py --old-key /tmp/old.json --new-key /tmp/new.json --mode "${{ inputs.mode }}"
      - name: Cleanup
        if: always()
        run: rm -f /tmp/old.json /tmp/new.json
