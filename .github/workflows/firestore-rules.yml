# Inspect / deploy Firestore rules for the app database, or read Saira
# diagnostics. Uses the FIREBASE_ADMIN_KEY service account.
name: Firestore rules & diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect | deploy | diag
        required: true
        default: inspect
        type: choice
        options: [inspect, deploy, diag]

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: python3 -m pip install --quiet google-auth

      - name: Decode admin key (raw or base64)
        env:
          ADMIN_RAW: ${{ secrets.FIREBASE_ADMIN_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, sys
          raw = os.environ.get("ADMIN_RAW") or ""
          if not raw.strip():
              print("::error::SECRET FIREBASE_ADMIN_KEY missing"); sys.exit(1)
          txt = raw if raw.lstrip().startswith("{") else base64.b64decode(re.sub(r"\s+", "", raw)).decode()
          json.loads(txt)
          open("/tmp/admin.json", "w").write(txt)
          PY

      - name: Run
        run: timeout 300s python3 .github/scripts/firestore_rules.py --key /tmp/admin.json --mode "${{ inputs.mode }}"

      - name: Cleanup
        if: always()
        run: rm -f /tmp/admin.json
