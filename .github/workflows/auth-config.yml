# Inspect / configure Firebase Auth providers for the app project.
name: Firebase Auth config

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect | enable-phone
        required: true
        default: inspect
        type: choice
        options: [inspect, enable-phone, sha, enable-password, admin-password]

jobs:
  auth:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet google-auth
      - name: Decode admin key
        env:
          ADMIN_RAW: ${{ secrets.FIREBASE_ADMIN_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re
          raw = os.environ["ADMIN_RAW"]
          txt = raw if raw.lstrip().startswith("{") else base64.b64decode(re.sub(r"\s+", "", raw)).decode()
          json.loads(txt)
          open("/tmp/admin.json", "w").write(txt)
          PY
      - name: Release signing fingerprints
        id: fp
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/ks.jks
            KS=/tmp/ks.jks; PASS="$ANDROID_KEYSTORE_PASSWORD"; ALIAS="$ANDROID_KEY_ALIAS"
          else
            KS=release.keystore
            PASS=$(grep '^storePassword=' keystore.properties | cut -d'=' -f2-)
            ALIAS=$(grep '^keyAlias=' keystore.properties | cut -d'=' -f2-)
          fi
          OUT=$(keytool -list -v -keystore "$KS" -alias "$ALIAS" -storepass "$PASS")
          echo "sha1=$(echo "$OUT" | grep -m1 'SHA1:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$OUT" | grep -m1 'SHA256:' | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          rm -f /tmp/ks.jks

      # admin-password: the secret arrives encrypted with a throw-away key
      # (same scheme as add-keys.yml); only ciphertext ever touches git.
      - name: Ephemeral key pair + publish public key
        if: inputs.mode == 'admin-password'
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/ephemeral.pem 2>/dev/null
          DIR=".github/incoming/${{ github.run_id }}"
          mkdir -p "$DIR"
          openssl pkey -in /tmp/ephemeral.pem -pubout -out "$DIR/pub.pem"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR/pub.pem"
          git commit -q -m "ci(auth): ephemeral public key for run ${{ github.run_id }}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin "HEAD:${{ github.ref_name }}" && break
            sleep 5
          done
      - name: Wait for + decrypt secret
        if: inputs.mode == 'admin-password'
        env:
          DIR: .github/incoming/${{ github.run_id }}
        run: |
          set -euo pipefail
          umask 077
          for i in $(seq 1 80); do
            git fetch -q origin "${{ github.ref_name }}"
            if git cat-file -e "FETCH_HEAD:$DIR/secret.enc" 2>/dev/null && git cat-file -e "FETCH_HEAD:$DIR/pass.enc" 2>/dev/null; then
              git show "FETCH_HEAD:$DIR/secret.enc" > /tmp/secret.enc
              git show "FETCH_HEAD:$DIR/pass.enc" | base64 -d > /tmp/pass.raw
              openssl pkeyutl -decrypt -inkey /tmp/ephemeral.pem -pkeyopt rsa_padding_mode:oaep \
                -pkeyopt rsa_oaep_md:sha256 -in /tmp/pass.raw -out /tmp/pass.bin
              openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -a -pass file:/tmp/pass.bin \
                -in /tmp/secret.enc -out /tmp/secret.txt
              rm -f /tmp/ephemeral.pem /tmp/pass.raw /tmp/pass.bin /tmp/secret.enc
              echo "decrypted after $i polls"; exit 0
            fi
            sleep 15
          done
          echo "::error::secret never arrived"; exit 1

      - name: google-services.json client check (ids only, no keys)
        if: inputs.mode == 'inspect'
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GS64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          REL_SHA1: ${{ steps.fp.outputs.sha1 }}
        run: |
          python3 - <<'PY2'
          import base64, json, os
          raw = os.environ.get("GS") or ""
          if not raw.strip() and os.environ.get("GS64"):
              raw = base64.b64decode(os.environ["GS64"]).decode()
          if raw.strip() and not raw.lstrip().startswith("{"):
              raw = base64.b64decode("".join(raw.split())).decode()
          if not raw.strip():
              print("::notice title=GSJSON::secret empty"); raise SystemExit
          d = json.loads(raw)
          rel = os.environ.get("REL_SHA1", "").replace(":", "").lower()
          out = [f"project={d['project_info'].get('project_id')} release_sha1={rel[:12]}"]
          for c in d.get("client", []):
              pkg = c["client_info"]["android_client_info"]["package_name"]
              oc = [(o.get("client_type"), o.get("client_id", "")[:28], (o.get("android_info") or {}).get("certificate_hash", "")[:12]) for o in c.get("oauth_client", [])]
              other = [(o.get("client_type"), o.get("client_id", "")[:28]) for o in (c.get("services", {}).get("appinvite_service", {}).get("other_platform_oauth_client", []))]
              out.append(f"{pkg} oauth={oc} other={other}")
          print("::notice title=GSJSON::" + " ;; ".join(out))
          PY2

      - name: Run
        run: |
          timeout 120s python3 .github/scripts/auth_config.py --key /tmp/admin.json \
            --mode "${{ inputs.mode }}" --test-number "+8801000000000" --test-code "123456" \
            --sha1 "${{ steps.fp.outputs.sha1 }}" --sha256 "${{ steps.fp.outputs.sha256 }}"
      - name: Cleanup
        if: always()
        run: rm -f /tmp/admin.json /tmp/secret.txt /tmp/ephemeral.pem /tmp/pass.*
