# Lightfall গেম-সাইট ডিপ্লয় — কনটেন্ট আসে 'lightfall-site' ব্রাঞ্চ থেকে
# (main-এ শুধু এই ওয়ার্কফ্লো ফাইলটাই থাকে; গেমের ফাইল main-এ নেই)
name: Deploy Lightfall site

on:
  push:
    branches: [ "main" ]
    paths: [ ".github/workflows/deploy-pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lightfall-site

      - name: সাইট প্রস্তুত
        run: |
          mkdir -p _site
          cp index.html README.md manifest.webmanifest sw.js icon-192.png icon-512.png icon-maskable.png _site/
          cp -r css js vendor _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
