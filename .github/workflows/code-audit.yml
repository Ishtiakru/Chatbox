name: Code audit (temporary)

on:
  push:
    branches:
      - arena/e6004471-chatbox
    paths:
      - .github/workflows/code-audit.yml
      - .github/audit-trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          yes 2>/dev/null | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
      - name: Stub google-services.json
        run: |
          printf '%s\n' '{"project_info":{"project_number":"000000000000","project_id":"chatbox-stub","storage_bucket":"chatbox-stub.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.aistudio.chatbox.kxmpzq"}},"oauth_client":[],"api_key":[{"current_key":"AIzaSTUB000000000000000000000000000000000"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile (all warnings) + Android lint
        run: |
          ./gradlew :app:compileDebugKotlin --no-daemon --rerun-tasks 2>&1 | tee compile.txt | tail -5
          ./gradlew :app:lintDebug --no-daemon --continue 2>&1 | tee lintout.txt | tail -5 || true
          for f in compile.txt lintout.txt; do
            T=$(grep -vE "^\s*$" $f | grep -E "rror|FAIL|What went wrong|e: |>" | tail -25 | sed 's/%/%25/g' | tr '\n' '\r' | sed 's/\r/%0A/g')
            echo "::notice title=tail-$f::$T"
          done
          grep -E "^w: " compile.txt | sed -E 's#^w: file://[^ ]*/app/src/main/java/##' > warnings.txt || true
          R=$(ls app/build/reports/lint-results-debug.txt 2>/dev/null | head -1)
          [ -n "$R" ] && cp "$R" lint.txt || echo "no lint report" > lint.txt
          wc -l warnings.txt lint.txt
      - name: Emit report part 1
        run: |
          python3 - <<'PY'
          import re
          def chunks(lines, size=7000):
              out, cur = [], ""
              for l in lines:
                  if len(cur) + len(l) > size: out.append(cur); cur = ""
                  cur += l + "\n"
              if cur: out.append(cur)
              return out
          w = open("warnings.txt").read().splitlines()
          lint = open("lint.txt").read().splitlines()
          # condense lint: keep header line of each issue + the summary
          keep = [l for l in lint if re.search(r": (Warning|Error|Information): ", l) or "errors," in l]
          allc = [("KOTLIN %d warnings" % len(w), c) for c in chunks(w)] + [("LINT %d issues" % len(keep), c) for c in chunks(keep)]
          open("allc.txt", "w").write(repr(allc))
          for i, (t, c) in enumerate(allc[:9]):
              msg = (t + " part %d/%d\n" % (i + 1, len(allc)) + c).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::notice title=audit%d::%s" % (i, msg))
          PY
      - name: Emit report part 2
        run: |
          python3 - <<'PY'
          import ast
          allc = ast.literal_eval(open("allc.txt").read())
          for i, (t, c) in enumerate(allc[9:18], 9):
              msg = (t + " part %d/%d\n" % (i + 1, len(allc)) + c).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::notice title=audit%d::%s" % (i, msg))
          PY
      - name: Emit report part 3
        run: |
          python3 - <<'PY'
          import ast
          allc = ast.literal_eval(open("allc.txt").read())
          for i, (t, c) in enumerate(allc[18:27], 18):
              msg = (t + " part %d/%d\n" % (i + 1, len(allc)) + c).replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print("::notice title=audit%d::%s" % (i, msg))
          PY
